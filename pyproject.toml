[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-care"
version = "5.0.0"
description = "A privacy-bounded memory recompiler for recovering poisoned clinical AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lakshit Sachdeva and Team" }]
keywords = ["agent-security", "clinical-informatics", "provenance", "memory-poisoning", "fhir"]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "cryptography>=42.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aegis-care = "aegis_care.cli:main"

[tool.setuptools.packages.find]
include = ["aegis_care*"]

[tool.setuptools.package-data]
"aegis_care.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
